<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMR Answer-Sheet Checking and Assessment System</title>
  
  <!-- Modern Typography (Outfit & Inter from Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Core Design System Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Production React & ReactDOM CDN (Requires zero Node.js server dependencies) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone compiler for real-time browser JSX parsing/execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    Babel.registerPreset('classic-react', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>
</head>
<body>

  <!-- Root mount node for React application -->
  <div id="root"></div>

  <!-- Main React/TSX Application Logic -->
  <script type="text/babel" data-presets="classic-react" src="app.jsx"></script>

</body>
</html>
